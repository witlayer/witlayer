name: Ultimate-1D-Counter-Linux

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # -----------------------------------------------------------
      # خطوة 1: إصلاح DNS وتثبيت cpulimit وتفادي أخطاء الشبكة المؤقتة
      # -----------------------------------------------------------
      - name: Fix DNS & Install System Control Tools
        run: |
          echo "🔧 Overriding DNS configuration for reliable resolution..."
          
          # فرض استخدام خوادم DNS عالمية بدلاً من DNS الداخلي لـ Azure
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null

          # تجاوز ملف المرايا apt-mirrors.txt لتجنب مشاكل InRelease
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true

          # التحديث مع 3 محاولات تلقائية لتفادي أي عطل لحظي
          for i in {1..3}; do
            sudo apt-get update -o Acquire::Retries=3 && break || sleep 5
          done

          sudo apt-get install -y cpulimit

      # -----------------------------------------------------------
      # خطوة 2: تثبيت Chrome و Chrome Remote Desktop و XFCE
      # -----------------------------------------------------------
      - name: Install Chrome & CRD
        run: |
          echo "⬇️ Downloading & Installing Desktop Environment & Chrome..."
          
          for i in {1..3}; do
            sudo apt-get install -y --no-install-recommends \
              wget curl xvfb dbus-x11 xfce4 xfce4-terminal desktop-base && break || sleep 5
          done

          # تثبيت Google Chrome
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm -f google-chrome-stable_current_amd64.deb

          # تثبيت Chrome Remote Desktop
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo apt-get install -y ./chrome-remote-desktop_current_amd64.deb
          rm -f chrome-remote-desktop_current_amd64.deb

          # تعيين Xfce كجلسة سطح مكتب افتراضية لـ CRD
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'

      # -----------------------------------------------------------
      # خطوة 3: تشغيل Chrome Remote Desktop
      # -----------------------------------------------------------
      - name: Start Chrome Remote Desktop
        env:
          CRD_CODE: ${{ secrets.CRD_CODE }}
          CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          # توليد رقم جهاز عشوائي في حال لم يكن DEVICE_NUM معرفاً
          DEVICE_NUM="${DEVICE_NUM:-$RANDOM}"
          UniqueName="${{ github.actor }}-Machine-${DEVICE_NUM}"
          echo "🚀 STARTING RDP SERVICE: $UniqueName"

          sudo mkdir -p /etc/chrome-remote-desktop
          sudo chown -R runner:runner /etc/chrome-remote-desktop

          # ربط وإطلاق خدمة CRD
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CRD_CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="$UniqueName" \
            --pin="$CRD_PIN" &

      # -----------------------------------------------------------
      # خطوة 4: تفعيل التقييد المذبذب المباشر (15% - 18%)
      # -----------------------------------------------------------
      - name: Dynamic CPU Limiter (15% - 18%)
        run: |
          echo "⚙️ Activating Dynamic Hardware Throttle Engine..."
          
          TARGET_EXE="svchost"
          
          (
            while true; do
              LIMIT=$((15 + RANDOM % 4))
              sudo cpulimit -e "$TARGET_EXE" -l "$LIMIT" -b >/dev/null 2>&1 || true
              SLEEP_TIME=$((20 + RANDOM % 26))
              sleep $SLEEP_TIME
            done
          ) &

      # -----------------------------------------------------------
      # خطوة 5: البقاء (Keep Alive)
      # -----------------------------------------------------------
      - name: Keep Alive
        run: |
          echo "✅ Runner active and CPU throttle engaged."
          while true; do sleep 300; done
