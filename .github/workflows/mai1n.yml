name: Ultimate-1D-Counter-Linux1

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:

      # -----------------------------------------------------------
      # خطوة تحضيرية: تحويل المستودعات إلى خوادم Azure الآمنة وتفادي التعليق
      # -----------------------------------------------------------
      - name: Configure Fast & Resilient Repositories
        run: |
          echo "🔄 Switching apt mirrors to Azure archive mirrors..."
          sudo sed -i 's|http://archive.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y

      # -----------------------------------------------------------
      # خطوة 1: تثبيت أدوات التحكم بالمعالج (cpulimit)
      # -----------------------------------------------------------
      - name: Install System Control Tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y --no-install-recommends cpulimit

      # -----------------------------------------------------------
      # خطوة 2: تثبيت Chrome و Chrome Remote Desktop وواجهة العرض
      # -----------------------------------------------------------
      - name: Install Chrome & CRD
        run: |
          echo "⬇️ Downloading & Installing Chrome & CRD..."
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y --no-install-recommends wget curl xvfb dbus-x11 xfce4 xfce4-terminal

          # تثبيت Google Chrome
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm google-chrome-stable_current_amd64.deb

          # تثبيت Chrome Remote Desktop
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo apt-get install -y ./chrome-remote-desktop_current_amd64.deb
          rm chrome-remote-desktop_current_amd64.deb

      # -----------------------------------------------------------
      # خطوة 3: تشغيل Chrome Remote Desktop
      # -----------------------------------------------------------
      - name: Start Chrome Remote Desktop
        env:
          CRD_CODE: ${{ secrets.CRD_CODE }}
          CRD_PIN: ${{ secrets.CRD_PIN }}
          DEVICE_NUM: ${{ env.DEVICE_NUM || '01' }}
        run: |
          UniqueName="${{ github.actor }}-Machine-${DEVICE_NUM}"
          echo "🚀 STARTING RDP SERVICE: $UniqueName"

          # إعداد مجلد الإعدادات لخدمة CRD
          sudo mkdir -p /etc/chrome-remote-desktop
          sudo chown -R runner:runner /etc/chrome-remote-desktop

          # ربط وإطلاق خدمة Chrome Remote Desktop
          DISPLAY= /opt/google/chrome-remote-desktop/start-host \
            --code="$CRD_CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="$UniqueName" \
            --pin="$CRD_PIN" &

      # -----------------------------------------------------------
      # خطوة 4: تفعيل التقييد المذبذب المباشر (15% - 18%)
      # -----------------------------------------------------------
      - name: Dynamic CPU Limiter (15% - 18%)
        run: |
          echo "⚙️ Activating Dynamic Hardware Throttle Engine..."
          
          TARGET_EXE="svchost"
          
          (
            while true; do
              LIMIT=$((15 + RANDOM % 4))
              sudo cpulimit -e "$TARGET_EXE" -l "$LIMIT" -b >/dev/null 2>&1 || true
              SLEEP_TIME=$((20 + RANDOM % 26))
              sleep $SLEEP_TIME
            done
          ) &

      # -----------------------------------------------------------
      # خطوة 5: البقاء (Keep Alive)
      # -----------------------------------------------------------
      - name: Keep Alive
        run: |
          echo "✅ Runner active and CPU throttle engaged."
          while true; do sleep 300; done
